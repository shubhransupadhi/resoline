# ==============================================================================
# Resoline Techbis Production Nginx Load Balancer Configuration
# Upstream load balancing with active health checks & failover
# ==============================================================================

upstream resoline_cluster {
    # Least connections load balancing algorithm
    least_conn;

    # Clustered backend nodes
    server web_node_1:8080 max_fails=3 fail_timeout=10s;
    server web_node_2:8080 max_fails=3 fail_timeout=10s;
    server web_node_3:8080 backup; # Fallback node

    keepalive 32;
}

server {
    listen 80;
    server_name resoline.in www.resoline.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name resoline.in www.resoline.in;

    # SSL TLS 1.3 Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # SSL Certificates
    ssl_certificate /etc/ssl/certs/resoline.crt;
    ssl_certificate_key /etc/ssl/private/resoline.key;

    # Global Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy Pass to Clustered Web Nodes
    location / {
        proxy_pass http://resoline_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;

        # Buffer optimization
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    # Health Check Proxy with Zero Caching
    location /api/health {
        proxy_pass http://resoline_cluster/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
